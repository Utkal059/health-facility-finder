# Tooling config only. Dependencies live in the requirements*.txt files so the
# API image can install the small runtime set without the scraper's browser.
[project]
name = "health-facility-finder"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["scraper/tests", "api/tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: needs a Postgres database at TEST_DATABASE_URL"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
