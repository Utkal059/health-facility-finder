name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Scraper and API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hff
          POSTGRES_PASSWORD: hff
          POSTGRES_DB: hff_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hff -d hff_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # A throwaway database inside the CI job; the integration tests wipe it.
      TEST_DATABASE_URL: postgresql://hff:hff@localhost:5432/hff_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
